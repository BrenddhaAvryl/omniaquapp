; ========================================================
; PlatformIO Project Configuration for OmniAqua ESP8266
; ========================================================

[platformio]
src_dir = omniaqua_esp8266

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.4

build_flags =
    -D MQTT_MAX_PACKET_SIZE=512

