services:
  # Banco de Dados Relacional para persistência de bombas, agendamentos e auditoria
  postgres:
    image: postgres:16-alpine
    container_name: omniaqua_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omniaqua
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omniaqua"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Broker MQTT para mensageria assíncrona entre Backend e ESP8266
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: omniaqua_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:

